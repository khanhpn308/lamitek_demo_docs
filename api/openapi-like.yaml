                $ref: "#/components/schemas/PingDeleteResponse"
        "403": { description: Chỉ admin }
        "404": { description: Device not found }

# WebSocket không thuộc OpenAPI 3 chuẩn cho FastAPI, nên không xuất hiện trong /openapi.json và Swagger UI.
# Để vẫn có tài liệu trong file này, dùng extension key `x-websocket-paths` bên dưới.
x-websocket-paths:
  /api/ws/global:
    tag: websocket
    summary: Stream realtime global cho toàn bộ frontend dashboard
    description: |
      Server broadcast dữ liệu cảm biến realtime từ MQTT đã chuẩn hóa.
      Client chỉ cần mở kết nối và nhận frame JSON; không bắt buộc gửi dữ liệu lên.
    authentication:
      browserSubprotocols: [iot-jwt, "<jwt>"]
      nonBrowserHeader: "Authorization: Bearer <jwt>"
      negotiatedSubprotocol: iot-jwt
      queryCredentialsAllowed: false
    serverToClientMessage:
      $ref: "#/components/schemas/RealtimeSensorMessage"
    test:
      url: ws://localhost:8000/api/ws/global
      notes:
        - Swagger UI (/docs) không test được WebSocket endpoint.
        - Dùng Postman WebSocket, Insomnia, hoặc wscat để test.

  /api/ws/devices/{device_id}:
    tag: websocket
    summary: Stream realtime theo từng thiết bị
    description: |
      Chỉ phát dữ liệu có device_id tương ứng với path param.
    authentication:
      browserSubprotocols: [iot-jwt, "<jwt>"]
      nonBrowserHeader: "Authorization: Bearer <jwt>"
      negotiatedSubprotocol: iot-jwt
      queryCredentialsAllowed: false
    pathParams:
      device_id:
        type: string
        example: "101"
    serverToClientMessage:
      $ref: "#/components/schemas/RealtimeSensorMessage"
    test:
      url: ws://localhost:8000/api/ws/devices/101

  /api/ws/esp32/{device_id}:
    tag: websocket
    summary: Kết nối WebSocket 2 chiều cho ESP32
    description: |
      Gateway gửi telemetry hoặc application-level JSON ping dạng text/binary UTF-8.
      URL device_id là danh tính Gateway dùng để xác thực; PingMessage.device_id là Node nguồn
      và không bắt buộc trùng URL ID. Node ID không thay thế cơ chế xác thực WebSocket.
      Ping hợp lệ được persist/commit rồi echo exact raw frame; không đi telemetry, Influx hay
      presence và không cập nhật last_seen_at. WebSocket legacy PING| không còn special-case echo.
    authentication:
      deviceSubprotocols: [iot-device, "<device-password>"]
      deviceHeader: "x-device-password: <device-password>"
      negotiatedSubprotocol: iot-device
      queryCredentialsAllowed: false
    pathParams:
      device_id:
        type: string
        example: "101"
    clientToServerMessage:
      oneOf:
        - $ref: "#/components/schemas/PingMessage"
        - $ref: "#/components/schemas/Esp32TelemetryMessage"
        - type: string
          description: Telemetry text hiện có; JSON ping hợp lệ echo exact raw text sau DB commit
        - type: string
          format: binary
          description: Binary UTF-8 JSON ping hợp lệ echo exact raw bytes; binary khác giữ pipeline cũ
    serverToClientMessage:
      oneOf:
        - $ref: "#/components/schemas/Esp32AckMessage"
        - $ref: "#/components/schemas/Esp32PongMessage"
        - $ref: "#/components/schemas/PingMessage"
        - $ref: "#/components/schemas/PingErrorMessage"
    test:
      url: ws://localhost:8000/api/ws/esp32/101
      notes:
        - JSON ping text/binary giữ nguyên frame type và raw bytes khi echo.
        - Ping lỗi nhận text PingErrorMessage và connection vẫn sống.

  /api/ws/pings:
    tag: websocket
    summary: Event thống kê Ping dành riêng cho admin
    description: |
      Canonical admin channel; `/ws/pings` là alias tương thích. Event chỉ phát sau ping/delete
      commit, không chứa raw payload hoặc credential và không đi global/device telemetry groups.
    authentication:
      browserSubprotocols: [iot-jwt, "<jwt>"]
      negotiatedSubprotocol: iot-jwt
      role: admin
      queryCredentialsAllowed: false
      nonAdminCloseCode: 1008
    serverToClientMessage:
      $ref: "#/components/schemas/PingStatsUpdatedEvent"

  /api/locations/{location_id}/anchors:
    get:
      tags: [anchors]
      summary: Danh sách Anchor active mà caller được xem
      responses:
        "200": { description: Danh sách Anchor theo anchor_id }
        "404": { description: Location ngoài scope }
    post:
      tags: [anchors]
      summary: Tạo Anchor và transactional delta outbox
      responses:
        "201": { description: Anchor và config revision pending }
        "403": { description: Thiếu quyền config Anchor }
        "409": { description: Trùng hardware ID hoặc tên active }

  /api/anchors/{anchor_id}:
    get:
      tags: [anchors]
      summary: Chi tiết Anchor trong view scope
      responses:
        "200": { description: Anchor }
        "404": { description: Không tồn tại hoặc ngoài scope }
    patch:
      tags: [anchors]
      summary: Sửa name/x/y/z; chỉ tạo delta revision khi dữ liệu thay đổi
      responses:
        "200": { description: Anchor và config revision pending }
        "403": { description: Thiếu quyền config Anchor }
    delete:
      tags: [anchors]
      summary: Soft-delete Anchor và tạo delta delete
      responses:
        "200": { description: Deleted Anchor ID và config revision }

  /api/anchors/manage:
    get:
      tags: [anchors]
      summary: Search/filter/pagination Anchor có quyền cấu hình
      responses:
        "200": { description: Page data/total/limit/offset }

  /api/locations/{location_id}/anchor-config-status:
    get:
      tags: [anchors]
      summary: Aggregate và trạng thái đồng bộ từng Gateway
      responses:
        "200": { description: synced/partial/pending/error/no_gateway }
        "403": { description: Thiếu quyền config Anchor }

  /api/locations/{location_id}/gateways/{gateway_id}/anchor-config-resync:
    post:
      tags: [anchors]
      summary: Tạo full replace revision chỉ cho Gateway được chọn
      responses:
        "202": { description: Config revision pending }
        "404": { description: Gateway không active/không thuộc location }

  /api/locations/{location_id}/anchor-config-resync:
    post:
      tags: [anchors]
      summary: Endpoint resync toàn location đã ngừng sử dụng
      responses:
        "410": { description: Dùng endpoint resync có gateway_id }

  /api/map-groups/{group_id}/invitations/bulk:
    post:
      tags: [map-groups]
      summary: Mời tối đa 50 username với partial results
      responses:
        "200": { description: invited_count/error_count/results }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MapGroupId:
      in: path
      name: group_id
      required: true
      schema:
        type: integer
    MapId:
      in: path
      name: map_id
      required: true
      schema:
        type: integer
  schemas:
    MapGroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        owner_username:
          type: string
          maxLength: 45
          nullable: true
          description: Chỉ admin được tạo group cho owner khác; phải khớp chính xác
    MapGroupPatch:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    MapGroupPublic:
      type: object
      required:
        - group_id
        - name
        - owner_user_id
        - owner_username
        - created_at
        - updated_at
        - access_role
        - can_manage
      properties:
        group_id: { type: integer }
        name: { type: string }
        owner_user_id: { type: integer }
        owner_username: { type: string }
        created_by_user_id:
          type: integer
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        access_role:
          type: string
          enum: [admin, owner, member]
        can_manage: { type: boolean }
    MapGroupInvitationCreate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 45
          description: Phải khớp chính xác
    MapGroupInvitationPatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
    MapGroupMembershipPublic:
      type: object
      required:
        - group_id
        - user_id
        - username
        - fullname
        - status
        - invited_at
      properties:
        group_id: { type: integer }
        user_id: { type: integer }
        username: { type: string }
        fullname: { type: string }
        status:
          type: string
          enum: [pending, accepted, rejected]
        invited_by_user_id:
          type: integer
          nullable: true
        invited_at: { type: string, format: date-time }
        responded_at:
          type: string
          format: date-time
          nullable: true
    MapGroupInvitationPublic:
      type: object
      required: [group_id, group_name, owner_username, status, invited_at]
      properties:
        group_id: { type: integer }
        group_name: { type: string }
        owner_username: { type: string }
        status:
          type: string
          enum: [pending, accepted, rejected]
        invited_at: { type: string, format: date-time }
        responded_at:
          type: string
          format: date-time
          nullable: true
    MapPublic:
      type: object
      required:
        - location_id
        - location
        - mime_type
        - original_filename
        - checksum_sha256
        - file_size_bytes
        - width
        - height
        - group_id
        - owner_user_id
        - created_at
        - image_url
      properties:
        location_id: { type: integer }
        location: { type: string }
        mime_type: { type: string, enum: [image/webp, image/png, image/jpeg] }
        original_filename: { type: string }
        checksum_sha256: { type: string, minLength: 64, maxLength: 64 }
        file_size_bytes:
          type: integer
          minimum: 1
          maximum: 10485759
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        group_id: { type: integer }
        owner_user_id: { type: integer }
        created_by_user_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        image_url: { type: string }
    DeletedMapPublic:
      type: object
      description: Metadata archive; không bao gồm image_data
      properties:
        location_id: { type: integer }
        location: { type: string }
        mime_type: { type: string }
        original_filename: { type: string }
        checksum_sha256: { type: string }
        file_size_bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
        group_id_snapshot: { type: integer }
        group_name_snapshot: { type: string }
        owner_user_id_snapshot: { type: integer }
        owner_username_snapshot: { type: string }
        created_by_user_id_snapshot: { type: integer, nullable: true }
        created_by_username_snapshot: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        deleted_by_user_id_snapshot: { type: integer }
        deleted_by_username_snapshot: { type: string }
        deleted_at: { type: string, format: date-time }
        delete_reason:
          type: string

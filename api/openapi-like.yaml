      type: object
      description: Payload realtime server broadcast về dashboard.
      properties:
        device_id:
          type: string
          example: "101"
        sensor_type:
          type: string
          example: temperature
        temperature:
          type: number
          format: float
          nullable: true
        vibration:
          type: number
          format: float
          nullable: true
        voltage:
          type: number
          format: float
          nullable: true
        current:
          type: number
          format: float
          nullable: true
        ts:
          type: number
          format: double
          description: Unix epoch seconds
        server_receive_ms:
          type: integer
          format: int64
          nullable: true
    Esp32TelemetryMessage:
      type: object
      description: Payload uplink từ ESP32 lên server.
      properties:
        device_id:
          type: string
          example: "101"
        temperature:
          type: number
          format: float
          nullable: true
        humidity:
          type: number
          format: float
          nullable: true
        timestamp_ms:
          type: integer
          format: int64
          nullable: true
    Esp32AckMessage:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        device_id:
          type: string
          example: "101"
        received:
          type: object
          additionalProperties: true
          nullable: true
    Esp32PongMessage:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        type:
          type: string
          example: pong
        device_id:
          type: string
          example: "101"
    PingMessage:
      type: object
      additionalProperties: false
      required: [device_id, sensor_type, order, size, payload, location, timestamp]
      description: |
        Strict application-level Node ping. `size` phải bằng UTF-8 byte length của `payload`;
        `timestamp` là Node uptime milliseconds, không phải Unix time.
      properties:
        device_id:
          type: string
          pattern: "^[1-9][0-9]*$"
          example: "101"
        sensor_type:
          type: string
          enum: [ping]
        order:
          type: integer
          minimum: 1
          maximum: 4294967295
        size:
          type: integer
          minimum: 1
          maximum: 16384
        payload:
          type: string
          example: BCDEFGHI
        location:
          type: string
        timestamp:
          type: integer
          format: int64
          minimum: 0
          example: 12345
    PingErrorMessage:
      type: object
      required: [ok, type, message]
      properties:
        ok: { type: boolean, enum: [false] }
        type: { type: string, enum: [ping_error] }
        message: { type: string, description: Lỗi validation/persistence đã redacted }
    PingCurrentPayload:
      type: object
      required: [id, order, timestamp]
      properties:
        id: { type: integer, format: int64 }
        order: { type: integer, minimum: 1, maximum: 4294967295 }
        timestamp: { type: integer, format: int64, minimum: 0, description: Node uptime ms }
    PingSummaryResponse:
      type: object

openapi: 3.0.3
info:
  title: IoT Backend API (OpenAPI-like)
  version: 1.0.0
  description: >
    Đặc tả API dạng OpenAPI-like cho hệ thống quản lý IoT.
    Tài liệu này phản ánh các endpoint hiện có trong backend FastAPI.
servers:
  - url: http://localhost:8000
    description: Môi trường local
tags:
  - name: auth
  - name: users
  - name: devices
  - name: authorizations
  - name: map-groups
  - name: maps
  - name: anchors
  - name: health
  - name: mqtt
  - name: pings
  - name: test
  - name: websocket
paths:
  /api/map-groups:
    get:
      tags: [map-groups]
      summary: Danh sách nhóm bản đồ có thể truy cập
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin nhận mọi nhóm; user nhận nhóm sở hữu hoặc đã accept
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapGroupPublic"
        "403":
          description: Tài khoản user không còn hiệu lực
    post:
      tags: [map-groups]
      summary: Tạo nhóm bản đồ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapGroupCreate"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapGroupPublic"
        "404":
          description: Không tìm thấy owner_username chính xác
        "409":
          description: Tên nhóm đã tồn tại theo owner

  /api/map-groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/MapGroupId"
    patch:
      tags: [map-groups]
      summary: Đổi tên nhóm (owner/admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapGroupPatch"
      responses:
        "200":
          description: Đổi tên thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapGroupPublic"
        "404":
          description: Không tìm thấy hoặc không có quyền quản lý
        "409":
          description: Tên nhóm đã tồn tại theo owner
    delete:
      tags: [map-groups]
      summary: Archive map active và xóa nhóm (owner/admin)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Đã archive map, dọn membership và xóa nhóm trong một transaction
        "404":
          description: Không tìm thấy hoặc không có quyền quản lý
        "409":
          description: Archive/cascade thất bại; transaction đã rollback

  /api/map-groups/{group_id}/members:
    get:
      tags: [map-groups]
      summary: Danh sách membership/lời mời của nhóm
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MapGroupId"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapGroupMembershipPublic"
        "404":
          description: Không tìm thấy hoặc không có quyền quản lý

  /api/map-groups/{group_id}/invitations:
    post:
      tags: [map-groups]
      summary: Mời user vào nhóm (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MapGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapGroupInvitationCreate"
      responses:
        "201":
          description: Tạo hoặc mở lại lời mời thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapGroupMembershipPublic"
        "404":
          description: Không tìm thấy group/user hoặc không có quyền
        "409":
          description: Self-invite, duplicate hoặc user inactive
        "429":
          description: Vượt 100 lời mời/giờ/JWT user

  /api/map-groups/{group_id}/members/{user_id}:
    delete:
      tags: [map-groups]
      summary: Hủy pending hoặc gỡ membership (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MapGroupId"
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Xóa membership thành công
        "404":
          description: Không tìm thấy hoặc không có quyền quản lý

  /api/map-group-invitations:
    get:
      tags: [map-groups]
      summary: Lời mời pending của user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapGroupInvitationPublic"
        "403":
          description: Tài khoản không còn hiệu lực

  /api/map-group-invitations/{group_id}:
    patch:
      tags: [map-groups]
      summary: Accept hoặc reject lời mời của user hiện tại
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MapGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapGroupInvitationPatch"
      responses:
        "200":
          description: Phản hồi thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapGroupInvitationPublic"
        "404":
          description: Không tìm thấy lời mời của user hiện tại
        "409":
          description: Đã phản hồi hoặc owner không còn active

  /api/map-groups/{group_id}/maps:
    parameters:
      - $ref: "#/components/parameters/MapGroupId"
    get:
      tags: [maps]
      summary: Danh sách metadata map active của nhóm
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin, owner hoặc accepted member xem được; không chứa BLOB
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapPublic"
        "404":
          description: Không tìm thấy nhóm hoặc không có quyền xem
    post:
      tags: [maps]
      summary: Upload ảnh WebP, PNG hoặc JPG vào nhóm (owner/admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [location, file]
              properties:
                location:
                  type: string
                  maxLength: 255
                file:
                  type: string
                  format: binary
                  description: Ảnh tĩnh WebP/PNG/JPEG, dung lượng từ 1 byte và nhỏ hơn 10 MiB
      responses:
        "201":
          description: Upload thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPublic"
        "404":
          description: Không tìm thấy nhóm hoặc không có quyền quản lý
        "409":
          description: Location active đã tồn tại, không phân biệt hoa/thường
        "413":
          description: File có dung lượng từ 10 MiB trở lên
        "415":
          description: Không phải WebP, PNG hoặc JPG/JPEG
        "422":
          description: Nội dung/định dạng thực tế không hợp lệ hoặc ảnh động
        "429":
          description: Vượt 30 upload/giờ/JWT user

  /api/maps/{map_id}/image:
    get:
      tags: [maps]
      summary: Tải BLOB ảnh của map đang active
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MapId"
      responses:
        "200":
          description: Ảnh với MIME đã xác thực, cache private/no-store và nosniff
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Map không tồn tại, đã archive hoặc không có quyền

  /api/maps/{map_id}:
    delete:
      tags: [maps]
      summary: Archive map active (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MapId"
      responses:
        "204":
          description: Archive thành công
        "404":
          description: Map không tồn tại hoặc không có quyền quản lý

  /api/admin/deleted-maps:
    get:
      tags: [maps]
      summary: Lịch sử metadata map đã archive (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Metadata phân trang, không chứa BLOB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedMapPage"
        "403":
          description: Chỉ admin

  /api/health:
    get:
      tags: [health]
      summary: Kiểm tra health tổng quát
      responses:
        "200":
          description: Thành công
  /api/health/db:
    get:
      tags: [health]
      summary: Kiểm tra kết nối cơ sở dữ liệu
      responses:
        "200":
          description: DB hoạt động bình thường
        "503":
      get:
        tags: [test]
        summary: Lấy danh sách log test
        security:
          - bearerAuth: []
        parameters:
          - in: query
            name: limit
            required: false
            schema:
              type: integer
              minimum: 1
              maximum: 1000
              default: 100
          - in: query
            name: device_name
            required: false
            schema:
              type: string
              nullable: true
          - in: query
            name: protocol
            required: false
            schema:
              type: string
              nullable: true
          - in: query
            name: device_id
            required: false
            schema:
              type: string
              nullable: true
        responses:
          "200":
            description: Thành công
          "403":
            description: Không có quyền admin
        "200":
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          description: Dữ liệu không hợp lệ hoặc trùng
        "403":
          description: Không có quyền admin

  /api/auth/bootstrap:
    post:
      tags: [auth]
      summary: Khởi tạo admin đầu tiên khi chưa có user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: Tạo admin đầu tiên thành công
        "403":
          description: Đã có user, bootstrap bị khóa

  /api/auth/me:
    get:
      tags: [auth]
      summary: Lấy thông tin user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "401":
          description: Chưa xác thực

  /api/auth/recover-password:
    post:
      tags: [auth]
      summary: Khôi phục mật khẩu bằng username + CCCD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverPasswordRequest"
      responses:
        "200":
          description: Cấp mật khẩu tạm mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverPasswordResponse"
        "400":
          description: Sai thông tin xác thực

  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Đổi mật khẩu
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Đổi mật khẩu thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Chưa xác thực

  /api/users:
    get:
      tags: [users]
      summary: Danh sách user (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"
        "403":
          description: Không có quyền admin

  /api/users/{user_id}:
    patch:
      tags: [users]
      summary: Cập nhật trạng thái user (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusPatch"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "404":
          description: Không tìm thấy user
    delete:
      tags: [users]
      summary: Xóa user và cascade lifecycle map thuộc sở hữu (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Đã archive map thuộc sở hữu, dọn quan hệ và xóa user trong một transaction
        "400":
          description: Không thể xóa chính mình
        "404":
          description: Không tìm thấy user
        "409":
          description: Archive/cascade thất bại; transaction đã rollback

  /api/devices:
    get:
      tags: [devices]
      summary: Danh sách thiết bị (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DevicePublic"
    post:
      tags: [devices]
      summary: Tạo thiết bị mới (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePublic"
        "409":
          description: Thiết bị đã tồn tại

  /api/devices/my:
    get:
      tags: [devices]
      summary: Danh sách thiết bị theo user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DevicePublic"

  /api/devices/{device_id}:
    get:
      tags: [devices]
      summary: Chi tiết thiết bị
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetailPublic"
        "404":
          description: Không tìm thấy hoặc không có quyền truy cập
    patch:
      tags: [devices]
      summary: Cập nhật một phần thiết bị (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePublic"
        "404":
          description: Không tìm thấy thiết bị
    delete:
      tags: [devices]
      summary: Xóa thiết bị và mọi phân quyền liên quan (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Đã xóa
        "404":
          description: Không tìm thấy thiết bị

  /api/devices/topics:
    get:
      tags: [devices]
      summary: Danh sách topic theo thiết bị (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceTopicPublic"
        "403":
          description: Không có quyền admin

  /api/devices/{device_id}/topic:
    put:
      tags: [devices]
      summary: Cập nhật topic riêng cho thiết bị (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTopicUpdate"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTopicPublic"
        "404":
          description: Không tìm thấy thiết bị

  /api/authorizations:
    get:
      tags: [authorizations]
      summary: Danh sách phân quyền theo user hoặc theo thiết bị (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_id
          required: false
          schema:
            type: integer
        - in: query
          name: device_id
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizationPublic"
        "400":
          description: Thiếu tham số hoặc truyền cả user_id và device_id
    post:
      tags: [authorizations]
      summary: Tạo phân quyền user-thiết bị (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationCreate"
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationPublic"
        "409":
          description: Phân quyền đã tồn tại

  /api/mqtt/status:
    get:
      tags: [mqtt]
      summary: Trạng thái MQTT subscriber
      responses:
        "200":
          description: Thành công
        "503":
          description: MQTT chưa được khởi tạo

  /api/mqtt/messages:
    get:
      tags: [mqtt]
      summary: Danh sách message MQTT gần nhất
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Thành công
        "503":
          description: MQTT chưa được khởi tạo

  /api/mqtt/topics:
    get:
      tags: [mqtt]
      summary: Danh sách topic MQTT đang theo dõi (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "403":
          description: Không có quyền admin

  /api/mqtt/topics/subscribe:
    post:
      tags: [mqtt]
      summary: Subscribe topic động khi runtime (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic:
                  type: string
                qos:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Thành công
        "403":
          description: Không có quyền admin

  /api/mqtt/topics/unsubscribe:
    post:
      tags: [mqtt]
      summary: Unsubscribe topic động khi runtime (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic:
                  type: string
                qos:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Thành công
        "403":
          description: Không có quyền admin

  /api/mqtt/history:
    get:
      tags: [mqtt]
      summary: Lịch sử dữ liệu cảm biến trong N phút gần nhất (InfluxDB)
      parameters:
        - in: query
          name: minutes
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 180
            default: 30
        - in: query
          name: device_id
          required: false
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Thành công
        "503":
          description: Influx service chưa được khởi tạo

  /api/test/config:
    get:
      tags: [test]
      summary: Lấy cấu hình test mode (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "403":
          description: Không có quyền admin
    put:
      tags: [test]
      summary: Cập nhật cấu hình test mode (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestConfigPayload"
      responses:
        "200":
          description: Thành công
        "403":
          description: Không có quyền admin

  /api/test/send:
    post:
      tags: [test]
      summary: Gửi payload test MQTT dạng text (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSendPayload"
      responses:
        "200":
          description: Thành công
        "403":
